name: Build Windows executable
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test including Windows spelling and automation services
        run: go test -v ./...
      - name: Build the portable x64 app
        run: |
          New-Item -ItemType Directory -Force dist
          go build -buildvcs=false -trimpath -ldflags "-s -w -H windowsgui" -o dist/Tobi-Dynavox-Spellchecker.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Tobi-Dynavox-Spellchecker-Windows-x64
          path: dist/Tobi-Dynavox-Spellchecker.exe
          if-no-files-found: error

  preview-release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.6.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Tobi-Dynavox-Spellchecker-Windows-x64
          path: dist
      - name: Publish the Windows and source downloads
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          git archive --format=zip --prefix=Tobi-Dynavox-Spellchecker/ HEAD -- . ':!docs/downloads' > dist/Tobi-Dynavox-Spellchecker-source.zip
          (cd dist && sha256sum Tobi-Dynavox-Spellchecker.exe Tobi-Dynavox-Spellchecker-source.zip > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
            --title "v0.6.1 — Reliable one-tap AAC trigger" \
            --notes "The existing --check action locates the saved AAC field even when the launching window briefly takes focus. No manual capture, check or apply steps are needed after linking. Tests cover full cold and warm launch paths. When two possible targets exist, the checker does not guess. TD Snap write-back and eye-gaze selection have not been tested on physical Tobii Dynavox hardware." \
            dist/Tobi-Dynavox-Spellchecker.exe dist/Tobi-Dynavox-Spellchecker-source.zip dist/SHA256SUMS.txt
